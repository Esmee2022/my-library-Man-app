<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Successful</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #dfe7ff, #e8f5e9);
      color: #1f2937;
    }
    .success-box {
      width: min(90vw, 520px);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(79, 70, 229, 0.18);
    }
    .checkmark {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #dff7e8;
      color: #15803d;
      font-size: 48px;
      font-weight: bold;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 3vw, 2.5rem);
    }
    p {
      margin: 0 0 26px;
      font-size: 1.02rem;
      color: #374151;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="checkmark">✓</div>
    <h1>Login Successful</h1>
    <p>Your account has been verified and you are now signed in.</p>

    <div class="actions">
      <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
      <a href="index.html" class="btn btn-secondary">Back to Login</a>
    </div>
  </div>
</body>
</html>
